name: Build Windows and Linux packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows-x64
            arch: x64
          - os: windows-11-arm
            label: Windows-ARM64
            arch: arm64
          - os: ubuntu-22.04
            label: Linux-x86_64
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: Desktop/requirements.txt
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libpulse0 libnss3 libasound2
      - run: |
          python -m pip install --only-binary=:all: -r Desktop/requirements.txt
      - name: Test source and render actual application screens
        env:
          QT_QPA_PLATFORM: offscreen
          MEDIAKEEP_SCREENSHOTS: docs/images/desktop
        run: python Desktop/mediakeep.py --self-test
      - run: python Desktop/build.py
      - name: Test frozen executable on Linux
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          MEDIAKEEP_SCREENSHOTS: docs/images/desktop
        run: dist/MediaKeep/MediaKeep --self-test
      - name: Test frozen executable on Windows
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          MEDIAKEEP_SCREENSHOTS: docs/images/desktop
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/MediaKeep/MediaKeep.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Frozen application tests failed: $($p.ExitCode)" }
      - name: Build and verify the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          $version = python -c "import sys; sys.path.insert(0,'Desktop'); from core import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the app version' }
          if ($env:PACKAGE_ARCH -eq 'arm64') {
            $package = "MediaKeep-$version-Windows-ARM64"
            $flags = @('/DMediaKeepARM64')
            $product = 'MediaKeep (ARM64)'
          } else {
            $package = "MediaKeep-$version-Windows-x64"
            $flags = @()
            $product = 'MediaKeep'
          }
          Expand-Archive "build/$package.zip" installer-input
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $compiler = if ($iscc) { $iscc.Source } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $compiler "/DMediaKeepVersion=$version" @flags Desktop/MediaKeep.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          function Invoke-Checked($File, $Arguments) {
            $process = Start-Process -FilePath $File -ArgumentList $Arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "$File exited with code $($process.ExitCode)" }
          }
          $setup = Join-Path $PWD "build/$package-Setup.exe"
          $install = Join-Path $env:LOCALAPPDATA "Programs/$product"
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) "$product.lnk"
          Invoke-Checked $setup '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
          if (-not (Test-Path $shortcut)) { throw 'Start menu shortcut missing' }
          Invoke-Checked "$install/MediaKeep.exe" '--self-test'
          Invoke-Checked "$install/unins000.exe" '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
          if ((Test-Path "$install/MediaKeep.exe") -or (Test-Path $shortcut)) { throw 'Uninstall left the application or shortcut behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: MediaKeep-${{ matrix.label }}
          path: |
            build/MediaKeep-*.zip
            build/MediaKeep-*.tar.gz
            build/MediaKeep-*-Setup.exe
            docs/images/desktop/*.png
          if-no-files-found: error
